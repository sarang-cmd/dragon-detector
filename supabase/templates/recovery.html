<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your DIS Weather Station password</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:32px;">
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#8a8a8a;">DIS Weather Station</div>
              <div style="font-size:22px;font-weight:600;color:#ffffff;padding-top:8px;">Dresden International School</div>
            </td>
          </tr>
          <tr>
            <td style="color:#e8e8e8;font-size:15px;line-height:1.6;padding:8px 0;">
              Someone asked to reset the password for <strong>{{ .Email }}</strong>.
              Tap below to choose a new one. If that was not you, just ignore this email.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 0;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#F6A800;color:#1a1a1a;font-size:15px;font-weight:600;text-decoration:none;padding:12px 32px;border-radius:12px;">Reset my password</a>
            </td>
          </tr>
          <tr>
            <td style="color:#5a5a5a;font-size:11px;padding-top:24px;border-top:1px solid #2a2a2a;margin-top:24px;">
              DIS Weather Club, Dresden International School, Annenstraße 9, 01067 Dresden-Altstadt.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
